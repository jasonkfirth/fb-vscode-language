# FreeBASIC extension: .github/workflows/verify.yml
# Verify source coverage, editor providers, and native VSIX packaging.
# This workflow does not publish releases or use marketplace credentials.
name: Verify extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      FREEBASIC_ROOT: ${{ github.workspace }}/.reference/fbc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the reference compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jasonkfirth/fbc
          ref: 88047b975e7f7d1c5b5255b4a3a6ac7b06fe3e3a
          path: .reference/fbc
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:corpus
      - name: Verify generated assets are checked in
        run: git diff --exit-code -- syntaxes/freebasic.tmLanguage.json data/language-reference.json
      - name: Test VS Code providers on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Test VS Code providers on Windows
        if: runner.os == 'Windows'
        run: npm run test:integration
      - run: npm run package:vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix-${{ runner.os }}
          path: dist/*.vsix
          if-no-files-found: error

# end of verify.yml
